version: 2

multi-ecosystem-groups:
  weekly-rollup:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    assignees:
      - JayRovacsek
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-rollup"
    commit-message:
      prefix: "chore(iac)"
    pull-request-branch-name:
      separator: "-"
    groups:
      all-nix:
        patterns:
          - "*"
