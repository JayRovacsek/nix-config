version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 3
    assignees:
      - JayRovacsek
    commit-message:
      prefix: "chore(iac)"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 3
    assignees:
      - JayRovacsek
    commit-message:
      prefix: "chore(iac)"
    pull-request-branch-name:
      separator: "-"
