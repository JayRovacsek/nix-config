# Tier: locked — locked-down AI use (inference + Nix caches only).
#
# The sandbox runs the opencode agent (via nix-shell) against the
# self-hosted inference endpoint: no general internet, no source control;
# the only package-registry egress is the Nix binary caches needed to
# realise opencode (see network_policies). Everything the agent can do is
# contained to its workdir; everything it can reach is the gateway-hosted
# model API and those caches.
#
# Attached providers: halogen-server (profiles/halogen-server.yaml).
#
# Codifies the home-manager-modules/opencode bash deny list in OpenShell
# terms: destructive commands (rm -rf, dd, mkfs, chmod 777) are contained by
# a workdir-only writable root; sudo/su are moot under the non-root process
# identity; package runners (npx, pip, cargo install, ...) and docker/podman
# have no network path (their registries and sockets are absent) and are not
# part of the image's minimal tool set.

version: 1

filesystem_policy:
  # The project workspace is the only writable tree besides /tmp and
  # /dev/null; the image's tooling is read-only. The nix-flakes image keeps
  # its binaries under /bin and /nix (bash's ELF interpreter lives in the
  # Nix store), so both are listed alongside the FHS paths the policy was
  # originally written for; entries an image lacks are skipped by the
  # supervisor. The sandbox's nix uses a store under /tmp (see the
  # --store flag on the sandbox command) so /nix stays read-only.
  include_workdir: true
  read_only:
    - /bin
    - /etc
    - /lib
    - /lib64
    - /nix
    - /proc
    - /usr
  read_write:
    - /tmp
    - /dev/null

# No explicit process selectors: the pinned default image has no `sandbox`
# account (explicit selectors must exist in the image), so the driver falls
# back to the image USER — non-root, matching the opencode policy of denying
# sudo/su/doas. Set numeric run_as_user/run_as_group once the image defines a
# dedicated sandbox account.

# Nix infrastructure egress: the nixpkgs channel (nixos.org, whose
# downloads are served from cache.nixos.org) plus the host's binary caches
# — the same hosts the host's nix.settings publishes, forwarded to the
# sandbox via NIX_CONFIG — scoped to the nix binary (/bin/nix). The
# halogen-server inference endpoints come from the attached provider
# (_provider_* composition).
network_policies:
  nix:
    name: nix
    endpoints:
      - { host: nixos.org, port: 443 }
      - { host: cache.nixos.org, port: 443 }
      - { host: nixos-raspberrypi.cachix.org, port: 443 }
      - { host: cache.nixos-cuda.org, port: 443 }
      - { host: nix-community.cachix.org, port: 443 }
      - { host: binarycache.rovacsek.com, port: 443 }
    binaries:
      - { path: /bin/nix }
