[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video_transcoder"
version = "0.1.0"
description = "A video transcoding library with LLM-driven optimization"
requires-python = ">=3.8"
dependencies = [
    "openai",
]

[project.scripts]
video-transcoder = "video_transcoder.cli:main"

