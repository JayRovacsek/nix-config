# Example Authelia OIDC configuration for Home Assistant.
# Fold the `home-assistant` client into secrets/authelia/secrets.age
# (referenced via services.authelia.instances.*.settingsFiles).
# Placeholder secret only — the real value is provided via the age file.
identity_providers:
  oidc:
    clients:
      - client_id: home-assistant
        client_name: Home Assistant
        client_secret: "$pbkdf2-sha512$REPLACE_ME"
        public: false
        authorization_policy: two_factor
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://home-assistant.rovacsek.com/auth/oidc/callback
        scopes: [openid, profile, groups]
        response_types: [code]
        grant_types: [authorization_code]
        token_endpoint_auth_method: client_secret_post
